services:
  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=change-me-please
      - DB_PATH=./data/app.db
      - INGEST_KEY=change-me-strong
    volumes:
      - ./backend/data:/app/data
    restart: always
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:4000
    environment:
      - VITE_API_URL=http://localhost:4000
    ports:
      - "3001:5173"
    depends_on:
      - api
  ping-monitor:
    build:
      context: .
      dockerfile: docker/monitor/Dockerfile
    image: semmaris/monitors:latest
    working_dir: /opt/monitors
    command: /opt/monitors/PingEquipment.ps1
    environment:
      - API_URL=http://api:4000
      - INGEST_KEY=change-me-strong
    depends_on:
      - api
    restart: always

  bandwidth-monitor:
    build:
      context: .
      dockerfile: docker/monitor/Dockerfile
    image: semmaris/monitors:latest
    working_dir: /opt/monitors
    command: /opt/monitors/BandwidthMonitor.ps1 -ApiUrl http://api:4000 -ApiKey change-me-strong
    depends_on:
      - api
    restart: always
