services:
  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=change-me-please
      - DB_PATH=./data/app.db
      - INGEST_KEY=change-me-strong
    volumes:
      - ./backend/data:/app/data
  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      - api
